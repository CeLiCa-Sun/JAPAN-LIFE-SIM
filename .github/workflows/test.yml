name: Ver 6.1 Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check sim.js
          node --check v42.js
          node --check v44.js
          node --check v45.js
          node --check v46.js
          node --check v47.js
          node --check v48.js
          node --check v49.js
          node --check v50.js
          node --check v51.js
          node --check v52.js
          node --check v53.js
          node --check v54.js
          node --check v55.js
          node --check v56.js
          node --check v57.js
          node --check v58.js
          node --check v59.js
          node --check v60.js
          node --check v61.js
          node --check city3d.js
          node --check main.js
          node --check storage.js
      - name: Node unit and integration tests
        run: node --test test.mjs
